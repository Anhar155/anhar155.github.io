const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='Checking\u2026';
  try{
    const pw=document.getElementById('pw').value;
    const keyMat=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:600000, hash:'SHA-256'},
      keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const gzBuf=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(NONCE)}, key, b64(DATA));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([gzBuf]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent='Wrong password \u2014 try again.';
    btn.disabled=false;
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
